name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
  push:
    branches: [master]
    paths:
      - "infra/**"

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read
  pull-requests: write # to comment the plan on PRs

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: prod
  TF_VAR_app_name: wow-insurance

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config=environments/prod/backend.hcl

      - run: terraform fmt -check -recursive

      - run: terraform validate

      - run: terraform plan -var-file=environments/prod/terraform.tfvars -no-color -out=tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TF_VAR_turso_database_url: ${{ secrets.TURSO_DATABASE_URL }}
          TF_VAR_turso_auth_token: ${{ secrets.TURSO_AUTH_TOKEN }}

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config=environments/prod/backend.hcl

      - run: terraform apply -auto-approve -var-file=environments/prod/terraform.tfvars
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TF_VAR_turso_database_url: ${{ secrets.TURSO_DATABASE_URL }}
          TF_VAR_turso_auth_token: ${{ secrets.TURSO_AUTH_TOKEN }}
